name: Build AudioMoth ESPnode firmware

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out ESPnode firmware fork
        uses: actions/checkout@v4
        with:
          path: firmware
          ref: master
          fetch-depth: 1

      - name: Show exact fork source being built
        run: |
          echo "Repository: Ash6414/AudioMoth-Firmware_ESPnode"
          echo "Branch: master"
          echo "Commit: $(git -C firmware rev-parse HEAD)"
          echo "espbridge.c busy implementation:"
          grep -n "ESPBridge_setBusy" -A8 firmware/src/espbridge.c
          if grep -R "GPIO_PinOutWrite" -n firmware/src firmware/inc; then
            echo "ERROR: fork source still contains GPIO_PinOutWrite"
            exit 1
          fi

      - name: Install ARM toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git make gcc-arm-none-eabi

      - name: Clone AudioMoth-Project build framework
        run: |
          git clone --depth 1 https://github.com/OpenAcousticDevices/AudioMoth-Project.git project

      - name: Copy fork source into AudioMoth-Project without editing it
        run: |
          cp -f firmware/src/main.c project/src/main.c
          cp -f firmware/src/*.c project/src/
          cp -f firmware/inc/*.h project/inc/
          echo "Build-tree espbridge.c busy implementation:"
          grep -n "ESPBridge_setBusy" -A8 project/src/espbridge.c
          if grep -R "GPIO_PinOutWrite" -n project/src project/inc; then
            echo "ERROR: build tree source still contains GPIO_PinOutWrite"
            exit 1
          fi

      - name: Configure AudioMoth-Project Makefile for CI only
        run: |
          sed -i 's|^TOOLCHAIN_PATH =.*|TOOLCHAIN_PATH = /usr|' project/build/Makefile
          sed -i 's|^TOOLCHAIN_VERSION =.*|TOOLCHAIN_VERSION = |' project/build/Makefile
          sed -i 's|^INC =.*|INC = ../cmsis ../device/inc ../emlib/inc ../emusb/inc ../drivers/inc ../fatfs/inc ../gps/inc ../inc|' project/build/Makefile
          sed -i 's|^SRC =.*|SRC = ../device/src ../emlib/src ../emusb/src ../drivers/src ../fatfs/src ../gps/src ../src|' project/build/Makefile

      - name: Build firmware binary
        working-directory: project/build
        run: |
          make clean
          make audiomoth.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiomoth-espnode-firmware
          path: |
            project/build/audiomoth.bin
            project/build/audiomoth.hex
            project/build/audiomoth.map
            project/build/audiomoth.lst
