name: Build AudioMoth firmware bin

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'inc/**'
      - '.github/workflows/build-audiomoth-bin.yml'

permissions:
  contents: read

jobs:
  build-bin:
    runs-on: ubuntu-latest

    steps:
      - name: Check out firmware source
        uses: actions/checkout@v4
        with:
          path: firmware
          ref: master
          fetch-depth: 1

      - name: Show source revision
        run: |
          set -euo pipefail
          echo "Repository: Ash6414/AudioMoth-Firmware_ESPnode"
          echo "Branch: master"
          echo "Commit: $(git -C firmware rev-parse HEAD)"
          test -f firmware/src/main.c
          test -f firmware/src/espbridge.c
          grep -n "ESP_TIME_WAIT_TIMEOUT_MS" firmware/src/main.c
          grep -n "ESPBridge_serviceUntil" -A3 firmware/src/espbridge.c

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi

      - name: Clone AudioMoth build framework
        run: |
          git clone --depth 1 https://github.com/OpenAcousticDevices/AudioMoth-Project.git project

      - name: Overlay repository files into build framework
        run: |
          set -euo pipefail
          cp -f firmware/src/*.c project/src/
          if [ -d firmware/inc ]; then
            cp -f firmware/inc/*.h project/inc/
          fi

      - name: Configure CI Makefile paths
        run: |
          set -euo pipefail
          sed -i 's|^TOOLCHAIN_PATH =.*|TOOLCHAIN_PATH = /usr|' project/build/Makefile
          sed -i 's|^TOOLCHAIN_VERSION =.*|TOOLCHAIN_VERSION = |' project/build/Makefile
          sed -i 's|^INC =.*|INC = ../cmsis ../device/inc ../emlib/inc ../emusb/inc ../drivers/inc ../fatfs/inc ../gps/inc ../inc|' project/build/Makefile
          sed -i 's|^SRC =.*|SRC = ../device/src ../emlib/src ../emusb/src ../drivers/src ../fatfs/src ../gps/src ../src|' project/build/Makefile

      - name: Build firmware binary
        working-directory: project/build
        run: |
          set -euo pipefail
          make clean
          make audiomoth.bin

      - name: Verify binary output
        run: |
          set -euo pipefail
          test -s project/build/audiomoth.bin
          ls -lh project/build/audiomoth.bin
          mkdir -p firmware-artifacts
          cp -f project/build/audiomoth.bin firmware-artifacts/audiomoth.bin
          cp -f project/build/audiomoth.hex firmware-artifacts/audiomoth.hex
          cp -f project/build/audiomoth.map firmware-artifacts/audiomoth.map
          cp -f project/build/audiomoth.lst firmware-artifacts/audiomoth.lst

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiomoth-firmware-bin
          path: firmware-artifacts/
          if-no-files-found: error
