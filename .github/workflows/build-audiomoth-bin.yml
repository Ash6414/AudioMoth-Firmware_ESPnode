name: Build AudioMoth firmware bin

on:
  workflow_dispatch:
    inputs:
      audiomoth_project_ref:
        description: AudioMoth-Project branch or tag to use as the build framework
        required: false
        default: master
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'inc/**'
      - 'tools/**'
      - '.github/workflows/build-audiomoth-bin.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'inc/**'
      - 'tools/**'
      - '.github/workflows/build-audiomoth-bin.yml'

permissions:
  contents: read

concurrency:
  group: audiomoth-firmware-build-${{ github.ref }}
  cancel-in-progress: true

env:
  AUDIOMOTH_PROJECT_REF: ${{ github.event.inputs.audiomoth_project_ref || 'master' }}

jobs:
  build-bin:
    runs-on: ubuntu-latest

    steps:
      - name: Check out firmware source at workflow ref
        uses: actions/checkout@v4
        with:
          path: firmware
          fetch-depth: 1

      - name: Show and validate source revision
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Workflow ref: ${GITHUB_REF}"
          echo "Ref name: ${GITHUB_REF_NAME}"
          echo "Commit: $(git -C firmware rev-parse HEAD)"
          echo "AudioMoth-Project ref: ${AUDIOMOTH_PROJECT_REF}"

          required_files=(
            firmware/src/main.c
            firmware/src/espbridge.c
            firmware/src/audioconfig.c
            firmware/src/digitalfilter.c
            firmware/src/gps.c
            firmware/inc/espbridge.h
            firmware/inc/audioconfig.h
            firmware/inc/digitalfilter.h
            firmware/inc/gps.h
            firmware/tools/apply-espbridge-request-service.py
            firmware/tools/apply-espbridge-hardware-uart.py
            firmware/tools/apply-espbridge-optional-request.py
            firmware/tools/apply-espbridge-sd-info.py
            firmware/tools/apply-espbridge-ready-beacon.py
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required firmware file: $file" >&2; exit 1; }
          done

          grep -F 'static uint8_t firmwareVersion[AM_FIRMWARE_VERSION_LENGTH] = {1, 12, 0};' firmware/src/main.c
          grep -F 'static uint8_t firmwareDescription[AM_FIRMWARE_DESCRIPTION_LENGTH] = "AudioMoth-Firmware-Basic";' firmware/src/main.c
          grep -F '#define ESPBRIDGE_DEFAULT_BAUD              115200' firmware/inc/espbridge.h
          grep -F '#define ESPBRIDGE_FAST_BAUD                 921600' firmware/inc/espbridge.h
          grep -F '#define ESPBRIDGE_TRAINING_BYTES            1024' firmware/inc/espbridge.h
          grep -F '#define ESPBRIDGE_FAST_PAYLOAD_TRAINING_BYTES 1024' firmware/inc/espbridge.h
          grep -F '#define ESPBRIDGE_SLOW_PAYLOAD_TRAINING_BYTES 128' firmware/inc/espbridge.h
          grep -F '#define ESPBRIDGE_CHUNK_BYTES               8192' firmware/inc/espbridge.h
          grep -F 'sendLine("OK BRIDGE_READY")' firmware/src/espbridge.c
          grep -F 'sendLine("OK PONG")' firmware/src/espbridge.c
          grep -F 'sendLine("OK FAST_READY")' firmware/src/espbridge.c
          grep -F 'commandBaud' firmware/src/espbridge.c
          grep -F 'commandFastCapability' firmware/src/espbridge.c
          grep -F 'GETFAST ' firmware/src/espbridge.c
          grep -F 'GETSTREAM ' firmware/src/espbridge.c
          grep -F 'sdReadMilliseconds' firmware/src/espbridge.c
          grep -F 'ESPBridge_handleReceivedByte' firmware/src/espbridge.c
          grep -F 'ESPBridge_handleReceivedByte(byte);' firmware/src/gps.c
          grep -F 'fileLooksLikeWav' firmware/src/espbridge.c

      - name: Install ARM GCC and build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version
          arm-none-eabi-objcopy --version

      - name: Clone AudioMoth build framework
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${AUDIOMOTH_PROJECT_REF}" https://github.com/OpenAcousticDevices/AudioMoth-Project.git project
          echo "AudioMoth-Project commit: $(git -C project rev-parse HEAD)"
          test -f project/build/Makefile
          test -f project/build/audiomoth.ld

      - name: Overlay this repository into AudioMoth-Project
        shell: bash
        run: |
          set -euo pipefail
          find firmware/src -maxdepth 1 -type f -name '*.c' -print -exec cp -f {} project/src/ \;
          find firmware/inc -maxdepth 1 -type f -name '*.h' -print -exec cp -f {} project/inc/ \;

          cmp -s firmware/src/main.c project/src/main.c
          cmp -s firmware/src/espbridge.c project/src/espbridge.c
          cmp -s firmware/inc/espbridge.h project/inc/espbridge.h

          echo "Overlay bridge snippets:"
          grep -n 'ESPBRIDGE_DEFAULT_BAUD' project/inc/espbridge.h
          grep -n 'OK BRIDGE_READY\|OK PONG\|OK DONE' project/src/espbridge.c

      - name: Apply hardware UART bridge patch
        shell: bash
        run: |
          set -euo pipefail
          python3 firmware/tools/apply-espbridge-hardware-uart.py
          grep -n 'USART_InitAsync_TypeDef uartInit' project/src/espbridge.c
          grep -n 'UART_ROUTE_TXPEN' project/src/espbridge.c
          grep -n 'UART_RX_POLL_US' project/src/espbridge.c
          grep -n 'startUartPollTimer' project/src/espbridge.c
          grep -n 'bridgeDelayMicroseconds' project/src/espbridge.c
          grep -n 'stopBridgeUart' project/src/espbridge.c
          grep -n 'bridgeSetBaud' project/src/espbridge.c
          grep -n 'USART_IntEnable(BRIDGE_UART, UART_IF_RXDATAV)' project/src/espbridge.c
          grep -n 'bufferedRxRead' project/src/espbridge.c
          grep -n 'BRIDGE_UART->STATUS & UART_STATUS_RXDATAV' project/src/espbridge.c
          grep -n 'USART_Rx(BRIDGE_UART)' project/src/espbridge.c
          grep -n 'FASTDATA ' project/src/espbridge.c
          grep -n 'GETSTREAM ' project/src/espbridge.c
          grep -n 'TESTSTREAM ' project/src/espbridge.c
          grep -n 'STREAM %s' project/src/espbridge.c
          grep -n 'OK TESTSTREAM' project/src/espbridge.c
          grep -n 'OK FASTCAP' project/src/espbridge.c
          grep -n 'sdReadMilliseconds' project/src/espbridge.c
          grep -n '#define UART_RX_POLL_US                    50' project/src/espbridge.c

      - name: Apply ESP request service patch
        shell: bash
        run: |
          set -euo pipefail
          python3 firmware/tools/apply-espbridge-request-service.py
          grep -n 'ESP32 startup request service' project/src/main.c
          grep -n 'ESP32 request service' project/src/main.c
          grep -n 'uploadServiceAllowed' project/src/main.c

      - name: Apply optional ESP request gate patch
        shell: bash
        run: |
          set -euo pipefail
          python3 firmware/tools/apply-espbridge-optional-request.py
          python3 firmware/tools/apply-espbridge-sd-info.py
          grep -n '#define BRIDGE_REQUIRE_REQ_PIN              0' project/src/espbridge.c
          grep -n 'bool requestActive = ESPBridge_isRequestActive();' project/src/espbridge.c
          grep -n 'fileCommandsAllowed' project/src/espbridge.c
          grep -n 'rawFilesystemBegin' project/src/espbridge.c
          grep -n 'AudioMoth_restartSDCardClock' project/src/espbridge.c
          grep -n 'INFO ENTRY' project/src/espbridge.c
          grep -n 'SKIP_ATTR' project/src/espbridge.c
          grep -n 'SKIP_PATH' project/src/espbridge.c
          grep -n 'SKIP_CONFIG' project/src/espbridge.c
          grep -n 'sendSdInfo' project/src/espbridge.c
          grep -n 'SD total_kb' project/src/espbridge.c

      - name: Apply repeated READY beacon patch
        shell: bash
        run: |
          set -euo pipefail
          python3 firmware/tools/apply-espbridge-ready-beacon.py
          grep -n '#define SERVICE_MAX_WINDOW_MS               7200000' project/src/espbridge.c
          grep -n '#define SERVICE_READY_BEACON_MS             1000' project/src/espbridge.c
          grep -n 'readyBeaconMs' project/src/espbridge.c

      - name: Configure AudioMoth Makefile for CI
        shell: bash
        run: |
          set -euo pipefail
          makefile=project/build/Makefile
          sed -i 's|^TOOLCHAIN_PATH =.*|TOOLCHAIN_PATH = /usr|' "$makefile"
          sed -i 's|^TOOLCHAIN_VERSION =.*|TOOLCHAIN_VERSION = |' "$makefile"
          sed -i 's|^INC =.*|INC = ../cmsis ../device/inc ../emlib/inc ../emusb/inc ../drivers/inc ../fatfs/inc ../gps/inc ../inc|' "$makefile"
          sed -i 's|^SRC =.*|SRC = ../device/src ../emlib/src ../emusb/src ../drivers/src ../fatfs/src ../gps/src ../src|' "$makefile"
          grep -n '^TOOLCHAIN_PATH\|^TOOLCHAIN_VERSION\|^INC =\|^SRC =' "$makefile"

      - name: Build firmware binary
        shell: bash
        working-directory: project/build
        run: |
          set -euo pipefail
          make clean
          make -j"$(nproc)" audiomoth.bin

      - name: Verify binary and collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s project/build/audiomoth.bin
          test -s project/build/audiomoth.hex
          test -s project/build/audiomoth.map
          test -s project/build/audiomoth.lst

          strings project/build/audiomoth.bin | grep -F 'AudioMoth-Firmware-Basic'
          strings project/build/audiomoth.bin | grep -F 'OK BRIDGE_READY'
          strings project/build/audiomoth.bin | grep -F 'OK PONG'
          strings project/build/audiomoth.bin | grep -F 'OK FAST_READY'
          strings project/build/audiomoth.bin | grep -F 'OK FASTCAP'
          strings project/build/audiomoth.bin | grep -F 'FASTDATA'
          strings project/build/audiomoth.bin | grep -F 'GETSTREAM'
          strings project/build/audiomoth.bin | grep -F 'OK STREAM'
          strings project/build/audiomoth.bin | grep -F 'TESTSTREAM'
          strings project/build/audiomoth.bin | grep -F 'OK TESTSTREAM'
          strings project/build/audiomoth.bin | grep -F 'SD total_kb='

          mkdir -p firmware-artifacts
          cp -f project/build/audiomoth.bin firmware-artifacts/audiomoth.bin
          cp -f project/build/audiomoth.hex firmware-artifacts/audiomoth.hex
          cp -f project/build/audiomoth.map firmware-artifacts/audiomoth.map
          cp -f project/build/audiomoth.lst firmware-artifacts/audiomoth.lst

          {
            echo "source_repository=${GITHUB_REPOSITORY}"
            echo "source_ref=${GITHUB_REF}"
            echo "source_ref_name=${GITHUB_REF_NAME}"
            echo "source_sha=$(git -C firmware rev-parse HEAD)"
            echo "audiomoth_project_ref=${AUDIOMOTH_PROJECT_REF}"
            echo "audiomoth_project_sha=$(git -C project rev-parse HEAD)"
            echo "firmware_description=AudioMoth-Firmware-Basic"
            echo "firmware_version=1.12.0"
            echo "espbridge_control_baud=115200"
            echo "espbridge_fast_baud=921600"
            echo "espbridge_training_bytes=1024"
            echo "espbridge_fast_payload_training_bytes=1024"
            echo "espbridge_slow_payload_training_bytes=128"
            echo "espbridge_chunk_bytes=8192"
            echo "espbridge_stream_bytes=65536"
            echo "espbridge_stream_fast_baud=921600"
            echo "espbridge_stream_control_baud_supported=true"
            echo "espbridge_production_stream_baud=115200"
            echo "espbridge_test_stream_bytes=1048576"
            echo "espbridge_sd_read_timing=header_milliseconds"
            echo "espbridge_transport=uart1_hardware_loc2_pb9_tx_pb10_rx"
            echo "espbridge_uart1_rx_poll_us=50"
            echo "espbridge_request_service=hardware_uart1_polled_rx_with_interrupt_buffer_115200_control_921600baud_tx_payload_idle_file_service_default_or_custom_any_sd_file_skip_config_sd_power_guard_skip_unsafe_sd_info"
            echo "espbridge_max_session_seconds=7200"
            date -u '+built_at_utc=%Y-%m-%dT%H:%M:%SZ'
          } > firmware-artifacts/build-info.txt

          ls -lh firmware-artifacts/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiomoth-firmware-bin
          path: firmware-artifacts/
          if-no-files-found: error
