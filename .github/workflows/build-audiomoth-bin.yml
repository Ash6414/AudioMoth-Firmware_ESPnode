name: Build AudioMoth ESPnode firmware

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out ESPnode firmware fork
        uses: actions/checkout@v4
        with:
          path: firmware

      - name: Install ARM toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git make gcc-arm-none-eabi

      - name: Clone AudioMoth-Project build framework
        run: |
          git clone https://github.com/OpenAcousticDevices/AudioMoth-Project.git project

      - name: Copy ESPnode firmware into AudioMoth-Project
        run: |
          cp firmware/src/main.c project/src/main.c
          cp firmware/src/*.c project/src/
          cp firmware/inc/*.h project/inc/

      - name: Patch Makefile for GitHub Actions toolchain and GPS sources
        run: |
          sed -i 's|^TOOLCHAIN_PATH =.*|TOOLCHAIN_PATH = /usr|' project/build/Makefile
          sed -i 's|^TOOLCHAIN_VERSION =.*|TOOLCHAIN_VERSION = |' project/build/Makefile
          sed -i 's|^INC =.*|INC = ../cmsis ../device/inc ../emlib/inc ../emusb/inc ../drivers/inc ../fatfs/inc ../gps/inc ../inc|' project/build/Makefile
          sed -i 's|^SRC =.*|SRC = ../device/src ../emlib/src ../emusb/src ../drivers/src ../fatfs/src ../gps/src ../src|' project/build/Makefile

      - name: Build firmware binary
        working-directory: project/build
        run: |
          make clean
          make audiomoth.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiomoth-espnode-firmware
          path: |
            project/build/audiomoth.bin
            project/build/audiomoth.hex
            project/build/audiomoth.map
            project/build/audiomoth.lst
