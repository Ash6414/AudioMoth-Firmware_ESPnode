name: TEMP Fix and Build ESPBridge

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/temp-fix-and-build-espbridge.yml'

permissions:
  contents: write

env:
  BUILD_FRAMEWORK_REPO: https://github.com/OpenAcousticDevices/AudioMoth-Project.git

jobs:
  fix-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out firmware repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch ESPBridge source if needed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          bridge_path = Path('src/espbridge.c')
          main_path = Path('src/main.c')

          bridge = bridge_path.read_text()
          main = main_path.read_text()

          if 'static inline void gpioWrite(' not in bridge:
              marker = 'static uint8_t chunkBuffer[ESPBRIDGE_CHUNK_BYTES];\n'
              helper = """
          static inline void gpioWrite(GPIO_Port_TypeDef port, unsigned int pin, bool value) {
              if (value) {
                  GPIO_PinOutSet(port, pin);
              } else {
                  GPIO_PinOutClear(port, pin);
              }
          }
          """
              if marker not in bridge:
                  raise SystemExit('Could not find chunkBuffer marker for gpioWrite helper')
              bridge = bridge.replace(marker, marker + helper + '\n', 1)

          bridge = bridge.replace(
              'GPIO_PinOutWrite(BRIDGE_BUSY_PORT, BRIDGE_BUSY_PIN, busy ? 1 : 0);',
              'gpioWrite(BRIDGE_BUSY_PORT, BRIDGE_BUSY_PIN, busy);'
          )
          bridge = bridge.replace(
              'GPIO_PinOutWrite(BRIDGE_BUSY_PORT, BRIDGE_BUSY_PIN, busy);',
              'gpioWrite(BRIDGE_BUSY_PORT, BRIDGE_BUSY_PIN, busy);'
          )

          bridge = bridge.replace(
              'void ESPBridge_serviceUntil(uint32_t deadlineUnixSeconds) {\n    if (bridgeBusy || !uploadAllowed) return;',
              'void ESPBridge_serviceUntil(uint32_t deadlineUnixSeconds) {\n    if (bridgeBusy) return;',
              1,
          )

          if 'static void commandDelete(char *args) {\n    char path[ESPBRIDGE_MAX_PATH];\n\n    if (bridgeBusy || !uploadAllowed)' not in bridge:
              bridge = bridge.replace(
                  'static void commandDelete(char *args) {\n    char path[ESPBRIDGE_MAX_PATH];\n',
                  'static void commandDelete(char *args) {\n    char path[ESPBRIDGE_MAX_PATH];\n\n    if (bridgeBusy || !uploadAllowed) {\n        sendLine("ERR BUSY upload_not_allowed");\n        return;\n    }\n\n',
                  1,
              )

          main = main.replace(
              'bool shouldPerformAcousticConfiguration = switchPosition == AM_SWITCH_CUSTOM && (AudioMoth_hasTimeBeenSet() == false || configSettings->requireAcousticConfiguration);',
              'bool shouldPerformAcousticConfiguration = switchPosition == AM_SWITCH_CUSTOM && configSettings->requireAcousticConfiguration;',
              1,
          )
          main = main.replace(
              'bool listenForAcousticTone = switchPosition == AM_SWITCH_CUSTOM && shouldPerformAcousticConfiguration == false;',
              'bool listenForAcousticTone = false;',
              1,
          )

          checks = [
              ('no GPIO_PinOutWrite', 'GPIO_PinOutWrite' not in bridge),
              ('gpioWrite helper present', 'static inline void gpioWrite(' in bridge),
              ('service allows TIME before upload', 'if (bridgeBusy || !uploadAllowed) return;' not in bridge),
              ('DELETE remains upload gated', 'if (bridgeBusy || !uploadAllowed)' in bridge),
              ('main has ESP time wait constants', 'ESP_TIME_WAIT_TIMEOUT_MS' in main),
              ('main has ESP time wait block', 'ESP32 time-setting path.' in main),
              ('acoustic tone disabled', 'bool listenForAcousticTone = false;' in main),
          ]
          for name, ok in checks:
              print(f'{name}: {ok}')
              if not ok:
                  raise SystemExit(f'Failed source check: {name}')

          bridge_path.write_text(bridge)
          main_path.write_text(main)
          PY

      - name: Commit source patch if changed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- src/main.c src/espbridge.c; then
            echo 'Source already contained required ESPBridge fixes.'
          else
            git diff -- src/main.c src/espbridge.c
            git add src/main.c src/espbridge.c
            git commit -m 'Fix AudioMoth ESPBridge source'
            git push origin master
          fi

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-dev \
            libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version
          printf '#include <time.h>\nint main(void){return 0;}\n' | arm-none-eabi-gcc -x c -E - >/dev/null

      - name: Clone AudioMoth build framework
        run: |
          set -euo pipefail
          git clone --depth 1 "$BUILD_FRAMEWORK_REPO" project

      - name: Overlay repository source into build framework
        run: |
          set -euo pipefail
          cp -f src/*.c project/src/
          if [ -d inc ]; then
            cp -f inc/*.h project/inc/
          fi
          if grep -R "GPIO_PinOutWrite" -n project/src project/inc; then
            echo 'ERROR: GPIO_PinOutWrite still exists in build tree.'
            exit 1
          fi
          grep -n "ESPBridge_setBusy" -A8 project/src/espbridge.c
          grep -n "ESPBridge_serviceUntil" -A4 project/src/espbridge.c

      - name: Configure Makefile
        run: |
          set -euo pipefail
          sed -i 's|^TOOLCHAIN_PATH =.*|TOOLCHAIN_PATH = /usr|' project/build/Makefile
          sed -i 's|^TOOLCHAIN_VERSION =.*|TOOLCHAIN_VERSION = |' project/build/Makefile
          sed -i 's|^INC =.*|INC = ../cmsis ../device/inc ../emlib/inc ../emusb/inc ../drivers/inc ../fatfs/inc ../gps/inc ../inc|' project/build/Makefile
          sed -i 's|^SRC =.*|SRC = ../device/src ../emlib/src ../emusb/src ../drivers/src ../fatfs/src ../gps/src ../src|' project/build/Makefile

      - name: Build AudioMoth firmware
        working-directory: project/build
        run: |
          set -euo pipefail
          make clean
          make audiomoth.bin

      - name: Package firmware outputs
        run: |
          set -euo pipefail
          test -s project/build/audiomoth.bin
          mkdir -p firmware-artifacts
          cp -f project/build/audiomoth.bin firmware-artifacts/audiomoth.bin
          cp -f project/build/audiomoth.hex firmware-artifacts/audiomoth.hex
          cp -f project/build/audiomoth.map firmware-artifacts/audiomoth.map
          cp -f project/build/audiomoth.lst firmware-artifacts/audiomoth.lst
          ls -lh firmware-artifacts

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiomoth-espbridge-fixed-firmware
          path: firmware-artifacts/
          if-no-files-found: error
